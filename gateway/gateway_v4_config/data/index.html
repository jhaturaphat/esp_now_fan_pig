<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>GatewayConfig</title>
    <style>
      body {
        font-family: Arial;
        margin: 0;
        padding: 0;
        text-align: center;
        background: #f9f9f9;
      }
      h1 {
        margin: 20px;
        font-size: 2em;
      }
      .container {
        max-width: 500px;
        margin: 20px auto;
        padding: 20px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      }
      form {
        display: flex;
        flex-direction: column;
      }
      label {
        text-align: left;
        margin-top: 10px;
        font-weight: bold;
      }
      input[type="number"],
      input[type="text"] {
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
      }
      .btn {
        background: #4caf50;
        color: #fff;
        padding: 12px;
        margin-top: 20px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
      }
      .btn:hover {
        background: #45a049;
      }
      .message {
        margin-top: 15px;
        font-size: 16px;
      }
      .error {
        color: red;
      }
      .success {
        color: green;
      }
      @media (max-width: 600px) {
        h1 {
          font-size: 1.5em;
        }
        .container {
          margin: 10px;
          padding: 15px;
        }
        .btn {
          padding: 10px;
          font-size: 15px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Gateway Config</h1>
    <div class="container">
        <div>ช่องสัญญาณตัวรับและตัวส่งต้องหมายเลขตรงกัน</div>
        <div>รองรับจำนวนเซ็นเซอร์ตั้งแต่หมายเลข 1-10 ตัว</div>
      <form id="configForm" onsubmit="submitForm(event)">        
        <label for="ch">Channel ID (1-13):</label>
        <input
          type="number"
          id="channel"
          name="channel"
          min="1"
          max="13"
          value="%CH_VALUE%"
          placeholder="1-13"
          required
        />        
        <input type="submit" value="Save & Restart" class="btn" />
      </form>
      <div id="message" class="message"></div>
      <div>Copyright by Mr.Jaturapat Siriboon</div>
    </div>
    <script>
      function trimInputs() {        
        let ch = document.getElementById("ch");       
      }
      async function submitForm(e) {
        e.preventDefault();
        trimInputs();
        let f = document.getElementById("configForm");
        let m = document.getElementById("message");
        let d = new FormData(f);
        try {
          let r = await fetch("/save", { method: "POST", body: d });
          if (r.ok) {
            m.textContent = "Saved successfully!";
            m.className = "message success";
          } else {
            let t = await r.text();
            m.textContent = "Error: " + t;
            m.className = "message error";
          }
        } catch (e) {
          m.textContent = "Error: Failed to connect to server";
          m.className = "message error";
        }
      }
    </script>
  </body>
</html>
