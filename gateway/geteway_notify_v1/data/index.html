<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KID จตุรภัทร</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <h1>ตั้งค่า WiFi 🛜</h1>
    <div class="content">
      <div class="form-group">
        <label for="wifi_ssid">ชื่อ Wifi 🕵🏻</label>
        <!-- เชื่อม input กับ datalist ด้วย list="wifi_list" -->
        <input type="text" id="wifi_ssid" list="wifi_list" onfocus="fetchWifiList()" placeholder="คลิกเพื่อค้นหา WiFi..." />
        <datalist id="wifi_list">
          <option value="กำลังค้นหา...">
        </datalist>
      </div>
      
      <div class="form-group">
        <label for="wifi_password">รหัส Wifi 🔢</label>
        <input type="text" id="wifi_password" />
      </div>
      <div class="form-group">
        <button onclick="saveWificfg()">💾 บันทึก</button>
      </div>
    </div>
    <br />
    <h1>🚨 แจ้งเตือน 🚨</h1>
    <div class="radio-group">
      <input type="radio" id="ntfy" name="notify" value="1" />
      <label for="ntfy">🚨ntfy.sh</label>

      <input type="radio" id="telegram" name="notify" value="2" />
      <label for="telegram">📣Telegram</label>

      <input type="radio" id="discord" name="notify" value="3" />
      <label for="discord">🎉Discord</label>
    </div>
    <br />
    <!-- content -->
    <div class="content" id="notify-content" style="display: none">
      <div class="form-group">
        <label for="location">🏠สถานที่ตั้ง</label>
        <input type="text" id="location" placeholder="ชื่อฟาร์ม 1,2,...">
      </div>
      <!-- ntfy.sh -->
      <div class="ntfy" style="display: none">
        <div class="form-group">
          <label for="topic">🦕Topic </label>
          <input type="text" id="topic" placeholder="https://ntfy.sh/mytopic" />
        </div>
      </div>
      <!-- Telegram -->
      <div class="telegram" style="display: none">
        <div class="form-group">
          <label for="telegram_token">🗝️Telegram Token </label>
          <input type="text" id="telegram_token" placeholder="8099954188:AAGYPRNbmwzUVgmVVERNDj9z2OONFcuwX6w"/>
        </div>
        <div class="form-group">
          <label for="telegram_channel">📻Telegram Chanel</label>
          <input type="text" id="telegram_channel" placeholder="-1003513801459"/>
        </div>
      </div>
      <!-- Discord -->
      <div class="discord" style="display: none">        
        <div class="form-group">
          <label for="discord_webhook">🧑‍🌾Webhook URL</label>
          <input
            type="text"
            id="discord_webhook"
            placeholder="https://discord.com/api/webhooks/1427287898759368744/pQCXfltKyhnN_rASeL4Jt-G2FGqFim8USSBepLEn0mDP7LAyFVhvV8diZkdH_Pco9ZB0"
          />
        </div>
      </div>
      <div class="shcedule">
        <div class="form-group">
          <label for="schedule">🕒แจ้งเตือน ทุกๆ ? ชม.</label>
          <input type="number" id="schedule" min="1" max="6" value="1"/>
        </div>
      </div>
      <!-- ปุ่ม -->
      <div class="form-group" id="btnSaveNotify" style="display: none">
        <button onclick="saveNotifycfg()">💾 บันทึก</button>
      </div>
    </div>

    <button class="floating-power-btn" onclick="ReloadWithCountdown()">⏻</button>
    
    <div style="text-align: center;">Copyright By Mr.Jaturapat Siriboon</div>

    <div id="countdownModal" class="modal">
      <div class="modal-content">
          <h2>⚙️ กำลังโหลดระบบใหม่</h2>
          <p>โปรดรอสักครู่ ระบบกำลังจะรีบูต/รีโหลด...</p>
          <div class="countdown-display" id="countdownTimer">3</div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
