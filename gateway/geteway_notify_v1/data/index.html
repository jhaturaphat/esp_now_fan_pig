<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KID จตุรภัทร</title>
    <style>
      /* รีเซ็ตค่าเริ่มต้นของ CSS */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        color: #333;
        line-height: 1.6;
        padding: 20px;
      }

      /* การจัดการของ h1 */
      h1 {
        text-align: center;
        margin-bottom: 20px;
      }

      /* การจัดการของ .content */
      .content {
        background: #fff;
        padding: 20px;
        margin-bottom: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      /* การจัดการของ .form-group */
      .form-group {
        margin-bottom: 15px;
      }

      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }

      .form-group input[type="text"],
      .form-group input[type="number"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
      }

      /* การจัดการของปุ่ม */
      button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        border: none;
        color: white;
        font-size: 16px;
        border-radius: 4px;
        cursor: pointer;
      }

      button:hover {
        background-color: #218838;
      }

      /* การจัดการของ .dev-by */
      .dev-by {
        text-align: center;
        margin-top: 20px;
      }

      /* Media Queries สำหรับหน้าจอขนาดเล็กกว่า 768px */
      @media (max-width: 768px) {
        body {
          padding: 10px;
        }

        .content {
          padding: 15px;
        }

        h1 {
          font-size: 1.5em;
        }

        button {
          font-size: 14px;
        }
      }

      /* Media Queries สำหรับหน้าจอขนาดเล็กกว่า 480px */
      @media (max-width: 480px) {
        h1 {
          font-size: 1.2em;
        }

        .form-group label {
          font-size: 14px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"] {
          font-size: 14px;
        }

        button {
          font-size: 14px;
          padding: 8px;
        }
      }

      /* ซ่อน radio button จริงๆ ไปเลย */
      input[type="radio"] {
        display: none;
      }
      .radio-group {
        display: flex;
        justify-content: center;
      }

      /* ออกแบบ label ให้ดูเหมือนปุ่มหรือกล่อง */
      .radio-group > label {
        padding: 10px 15px;
        border: 2px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
        margin-right: 10px;
        transition: background-color 0.3s, border-color 0.3s;
      }

      /* เมื่อ radio button ถูกเช็ค ให้เปลี่ยนสไตล์ของ label ที่ตามหลังมา */
      input[type="radio"]:checked + label {
        background-color: #007bff; /* สีน้ำเงินสวยๆ */
        color: white;
        border-color: #007bff;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h1>ตั้งค่า 🛜 WiFi</h1>
    <div class="form-group">
      <label for="wifi_ssid">ชื่อ Wifi 🕵🏻</label>
      <input type="text" id="wifi_ssid" />
    </div>
    <div class="form-group">
      <label for="wifi_password">รหัส Wifi 🔢</label>
      <input type="text" id="wifi_password" />
    </div>
    <div class="form-group">
      <button onclick="saveWificfg()">บันทึก</button>
    </div>

    <br />
    <h1>แจ้งเตือน 🚨</h1>
    <div class="radio-group">
      <input type="radio" id="opt1" name="fancyOption" value="1" />
      <label for="opt1">ntfy.sh</label>

      <input type="radio" id="opt2" name="fancyOption" value="2" />
      <label for="opt2">Telegram</label>

      <input type="radio" id="opt3" name="fancyOption" value="2" />
      <label for="opt3">Discord</label>
    </div>
    <br />
    <div class="content">
      <!-- ntfy.sh -->
      <div class="ntfy">
        <div class="form-group">
          <label for="line_token">Topic</label>
          <input type="text" id="line_token" />
        </div>        
      </div>
      <!-- Telegram -->
      <div class="telegram">
        <div class="form-group">
          <label for="line_token">Telegram Token</label>
          <input type="text" id="line_token" />
        </div>
        <div class="form-group">
          <label for="chanel">Telegram Chanel</label>
          <input type="text" id="chanel" />
        </div>
      </div>
      <!-- Discord -->
      <div class="discord">
        <div class="form-group">
          <label for="line_token">Webhook URL</label>
          <input type="text" id="line_token" />
        </div>        
      </div>
    </div>
  </body>
</html>
